name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: temurin
          cache: gradle

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Build debug APK
        run: ./gradlew :app:assembleDebug --no-daemon

      - name: Rename APK with build number
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk \
             YiHua-debug-${{ github.run_number }}.apk

      - name: Upload APK as artifact
        uses: actions/upload-artifact@v4
        with:
          name: YiHua-debug-${{ github.run_number }}
          path: YiHua-debug-${{ github.run_number }}.apk
          retention-days: 30

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: dev-${{ github.run_number }}
          name: "Debug Build #${{ github.run_number }}"
          prerelease: true
          files: YiHua-debug-${{ github.run_number }}.apk
          body: |
            🤖 自动构建 Debug APK

            - **Build:** #${{ github.run_number }}
            - **Commit:** ${{ github.sha }}
            - **Branch:** ${{ github.ref_name }}

            > ⚠️ 如无法覆盖安装，请先卸载旧版本再安装。

      - name: Notify Feishu on success
        if: success()
        env:
          FEISHU_WEBHOOK: ${{ secrets.FEISHU_BOT_WEBHOOK }}
        run: |
          if [ -z "$FEISHU_WEBHOOK" ]; then exit 0; fi
          curl -s -X POST "$FEISHU_WEBHOOK" \
            -H "Content-Type: application/json" \
            -d "{
              \"msg_type\": \"text\",
              \"content\": {
                \"text\": \"✅ APK 构建成功\nBuild #${GITHUB_RUN_NUMBER}\nCommit: ${GITHUB_SHA}\nRelease: https://github.com/${GITHUB_REPOSITORY}/releases/tag/dev-${GITHUB_RUN_NUMBER}\"
              }
            }"

      - name: Notify Feishu on failure
        if: failure()
        env:
          FEISHU_WEBHOOK: ${{ secrets.FEISHU_BOT_WEBHOOK }}
        run: |
          if [ -z "$FEISHU_WEBHOOK" ]; then exit 0; fi
          curl -s -X POST "$FEISHU_WEBHOOK" \
            -H "Content-Type: application/json" \
            -d "{
              \"msg_type\": \"text\",
              \"content\": {
                \"text\": \"❌ APK 构建失败\nBuild #${GITHUB_RUN_NUMBER}\nCommit: ${GITHUB_SHA}\n详情: https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}\"
              }
            }"
