name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: temurin
          cache: gradle

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      # ── 检测签名 secrets 是否完整 ──────────────────────────────────────
      - name: Check signing secrets
        id: signing
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_B64" ] && [ -n "$KEYSTORE_PASSWORD" ] && [ -n "$KEY_ALIAS" ] && [ -n "$KEY_PASSWORD" ]; then
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
          fi

      # ── Debug APK（始终构建）────────────────────────────────────────────
      - name: Build debug APK
        run: ./gradlew :app:assembleDebug --no-daemon

      - name: Rename debug APK
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk \
             YiHua-debug-${{ github.run_number }}.apk

      # ── Signed Release APK（仅 secrets 完整时构建）─────────────────────
      - name: Decode keystore
        if: steps.signing.outputs.available == 'true'
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: echo "$KEYSTORE_B64" | base64 -d > /tmp/release.jks

      - name: Build signed release APK
        if: steps.signing.outputs.available == 'true'
        env:
          SIGNING_KEYSTORE_PATH: /tmp/release.jks
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: ./gradlew :app:assembleRelease --no-daemon

      - name: Rename release APK
        if: steps.signing.outputs.available == 'true'
        run: |
          cp app/build/outputs/apk/release/app-release.apk \
             YiHua-release-${{ github.run_number }}.apk

      - name: Clean up keystore
        if: always()
        run: rm -f /tmp/release.jks

      # ── 上传 Artifact ─────────────────────────────────────────────────
      - name: Upload debug APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: YiHua-debug-${{ github.run_number }}
          path: YiHua-debug-${{ github.run_number }}.apk
          retention-days: 30

      - name: Upload release APK artifact
        if: steps.signing.outputs.available == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: YiHua-release-${{ github.run_number }}
          path: YiHua-release-${{ github.run_number }}.apk
          retention-days: 30

      # ── GitHub Release ────────────────────────────────────────────────
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: dev-${{ github.run_number }}
          name: "Build #${{ github.run_number }}"
          prerelease: true
          fail_on_unmatched_files: false
          files: |
            YiHua-debug-${{ github.run_number }}.apk
            YiHua-release-${{ github.run_number }}.apk
          body: |
            🤖 自动构建

            - **Build:** #${{ github.run_number }}
            - **Commit:** ${{ github.sha }}
            - **Branch:** ${{ github.ref_name }}

            > Debug APK 仅供测试；若 Release APK 存在则签名稳定，可直接覆盖安装。

      # ── 飞书通知 ──────────────────────────────────────────────────────
      - name: Notify Feishu on success
        if: success()
        env:
          FEISHU_WEBHOOK: ${{ secrets.FEISHU_BOT_WEBHOOK }}
        run: |
          if [ -z "$FEISHU_WEBHOOK" ]; then exit 0; fi
          curl -s -X POST "$FEISHU_WEBHOOK" \
            -H "Content-Type: application/json" \
            -d "{
              \"msg_type\": \"text\",
              \"content\": {
                \"text\": \"✅ APK 构建成功\nBuild #${GITHUB_RUN_NUMBER}\nCommit: ${GITHUB_SHA}\nRelease: https://github.com/${GITHUB_REPOSITORY}/releases/tag/dev-${GITHUB_RUN_NUMBER}\"
              }
            }"

      - name: Notify Feishu on failure
        if: failure()
        env:
          FEISHU_WEBHOOK: ${{ secrets.FEISHU_BOT_WEBHOOK }}
        run: |
          if [ -z "$FEISHU_WEBHOOK" ]; then exit 0; fi
          curl -s -X POST "$FEISHU_WEBHOOK" \
            -H "Content-Type: application/json" \
            -d "{
              \"msg_type\": \"text\",
              \"content\": {
                \"text\": \"❌ APK 构建失败\nBuild #${GITHUB_RUN_NUMBER}\nCommit: ${GITHUB_SHA}\n详情: https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}\"
              }
            }"
